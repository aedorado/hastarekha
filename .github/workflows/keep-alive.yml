name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 06:00 UTC (well within Supabase's 7-day inactivity pause window)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_KEY secret is not configured in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Pinging Supabase REST API to prevent inactivity pause..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/hands?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          echo "Response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase database keep-alive ping succeeded!"
          else
            echo "⚠️ Unexpected status code: $HTTP_STATUS"
            # Attempt auth health check as fallback
            FALLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/auth/v1/health" \
              -H "apikey: ${SUPABASE_KEY}")
            echo "Fallback status: $FALLBACK_STATUS"
          fi

